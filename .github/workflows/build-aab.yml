name: Build Android AAB

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Prod
    env:
      SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Build AAB
        working-directory: apps/mobile
        run: |
          flutter build appbundle --release \
            --dart-define=API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Sign AAB Artifact
        if: env.SIGNING_KEY_BASE64 != ''
        id: sign_app
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: apps/mobile/build/app/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.SIGNING_STORE_PASSWORD }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Upload Signed AAB Artifact
        if: env.SIGNING_KEY_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: signed-app-bundle
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}

      - name: Upload Unsigned AAB Artifact
        if: env.SIGNING_KEY_BASE64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app-bundle
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
